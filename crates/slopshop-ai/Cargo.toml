[package]
name = "slopshop-ai"
description = "SlopShop's AI helper (ADR 0025): the protocol and client (library), and the slopshop-ai executable that runs the models through ONNX Runtime (feature `helper`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "slopshop-ai"
path = "src/main.rs"
required-features = ["helper"]

[features]
# The executable: ONNX Runtime, loaded at run time from a library the app downloads (never
# linked, never shipped with the editor). The library side (protocol, client) needs nothing.
helper = ["dep:ort"]
# The installer of ONNX Runtime and the models (`install` module): HTTPS, SHA-256, inflate.
install = ["dep:ureq", "dep:sha2", "dep:flate2"]

[dependencies]
# ONNX Runtime bindings (MIT OR Apache-2.0), only in the helper. `load-dynamic`: nothing is
# linked or downloaded at build time; the runtime library is opened from a path at start.
# `api-24`: ONNX Runtime 1.24, the last DirectML release (ADR 0025). Release candidate: the 2.0
# API is the one maintained.
ort = { version = "=2.0.0-rc.13", default-features = false, optional = true, features = [
    "std",
    "load-dynamic",
    "api-24",
    "directml",
    "coreml",
] }
# HTTPS client for the installer (MIT OR Apache-2.0): blocking (downloads run on their own
# thread), rustls with its default ring provider and Mozilla's roots, no tokio. std has no HTTP.
ureq = { version = "3.4.2", optional = true, default-features = false, features = ["rustls"] }
# SHA-256 of downloaded files, to check them against their pins (RustCrypto, MIT OR Apache-2.0).
sha2 = { version = "0.11.0", optional = true }
# Inflates the files fetched from inside zip archives (raw deflate), on zlib-rs; both are
# already in the workspace through DICOM's decoders (MIT OR Apache-2.0, Zlib).
flate2 = { version = "1.1.10", optional = true, default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true

[[test]]
name = "helper"
required-features = ["helper"]

[[test]]
name = "install"
required-features = ["install"]

[[example]]
name = "erase_spike"
required-features = ["helper"]

[dev-dependencies]
# PNG decoding and encoding of the Erase test vectors in the spike (already in the workspace).
png.workspace = true
