[package]
name = "slopshop-io"
description = "SlopShop file formats: decoding images into the engine's tiled rasters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
slopshop-core.workspace = true
# Pure-Rust decoders for the common formats (explicit feature list, no C code; ADR 0006).
image = { workspace = true }
# TIFF directly (not through `image`, which maps CMYK to RGB silently): native bit depths,
# ICC and orientation tags, multi-page detection.
tiff = { workspace = true }
# `tiff` returns half floats as `half::f16`; already in the tree through `tiff` and `exr`.
half = "2"
# Header-only reads of what `image` does not expose. All of them are already in the tree
# through `image`, with the same features.
# - PNG color chunks (cICP, sRGB, gAMA, cHRM).
png = { workspace = true }
# - GIF frame count without decoding the frames.
gif = { workspace = true }
# - JPEG component color space, to refuse CMYK instead of converting it silently.
zune-jpeg = { workspace = true }
# - OpenEXR chromaticities (the primaries of the file). Default features: `rayon`, which
#   `image` already enables on it.
exr = { workspace = true }
# TIFF export compresses its own strips (tiff's streaming encoder ignores compression, and its
# codecs are private) with the codecs tiff uses internally, already in the tree through it:
# - LZW;
weezl = "0.1.12"
# - Deflate (zlib).
flate2 = "1.1.10"
# JPEG export (ADR 0010): pure Rust, fed band by band through its pull API (baseline JPEG
# streams with bounded memory). `image`'s own JPEG encoder takes whole buffers and drops alpha
# silently. License (MIT OR Apache-2.0) AND IJG: allowed for this crate only in deny.toml.
jpeg-encoder = { version = "=0.7.1", features = ["simd"] }
# Lossless WebP export (ADR 0010): pure Rust, `forbid(unsafe)`; already in the tree through
# `image`, which does not expose ICC profiles or encoder settings.
image-webp = "=0.2.4"
# Lossy WebP export (ADR 0010): libwebp (C, BSD-3-Clause), built with `cc`, no system library.
# No pure-Rust lossy encoder is usable. Called from our `export::webp::ffi` module only, the one
# `unsafe` module of this crate. Default features kept: they enable libwebp's threads.
libwebp-sys = "=0.14.4"
# Document files (.slop, ADR 0009):
# - tile identity and integrity (content addressing): std has no cryptographic hash, and
#   xxh3's collisions can be crafted. Default build (SIMD through cc).
blake3 = "1.8.7"
# - tile, table and manifest compression: libzstd (C, BSD-3-Clause), an accepted exception to
#   "no C code" (ADR 0009) for its ratio and speed; the codec is recorded per blob.
zstd = "0.14.0"
# - the JSON manifest, through explicit DTOs (never derives on core types). Both are already in
#   the tree through Tauri.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Zip archives opened like several files (collection module): reading stored and deflate entries
# only, through flate2 (already in the tree, pure Rust backend); the other methods and
# encryption are left out. MIT.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
