[package]
name = "slopshop-app"
description = "SlopShop desktop shell (Tauri). Thin IPC layer over the engine crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (cargo#8519).
name = "slopshop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
slopshop-core.workspace = true
slopshop-render.workspace = true
slopshop-io.workspace = true
# The AI components' installer (ADR 0025); the models run in the separate helper.
slopshop-ai = { workspace = true, features = ["install"] }
# Desktop shell (webview window, IPC).
tauri = { version = "2", features = [] }
# IPC DTOs (de)serialization; Tauri already depends on it.
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
# "Show in folder" after an export: selects the file in Explorer / Finder / the Linux file
# manager (official plugin; its JavaScript commands are not granted, only our command uses it).
tauri-plugin-opener = "2"
# Copy and Paste: reads images (PNG, DIB) and copied file lists from the OS clipboard and
# writes the image of a copy for other applications, in Rust, so that pixels never go through
# the webview. Pure Rust over the OS APIs (MIT OR Apache-2.0,
# by 1Password); std has no clipboard, and Tauri's clipboard plugin wraps it for JavaScript
# only, where images would cross the IPC.
arboard = "3.6.1"
# Official Tauri plugins (MIT OR Apache-2.0) for desktop window behavior; small, Rust only,
# their JavaScript commands are not granted:
# - a second launch focuses the running window and hands it its files;
tauri-plugin-single-instance = "2.5.1"
# - the window's size, position and maximized state are remembered between launches.
tauri-plugin-window-state = "2.5.0"

[dev-dependencies]
# Tests deserialize IPC requests the way Tauri does.
serde_json = "1"

[lints]
workspace = true
