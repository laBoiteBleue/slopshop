[workspace]
resolver = "3"
members = [
    "crates/slopshop-core",
    "crates/slopshop-render",
    "crates/slopshop-io",
    "crates/slopshop-cli",
    "crates/slopshop-raw",
    "crates/slopshop-ai",
    "app/src-tauri",
]

[workspace.package]
# SlopShop's version, and the only place it is written: every crate, the application (Tauri
# reads it, tauri.conf.json has none) and its About dialog take it from here. A release changes
# this line, then `cargo update --workspace` (see docs/releasing.md).
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
repository = "https://github.com/laBoiteBleue/slopshop"

[workspace.dependencies]
# Paths only: the crates are not published, so they need no version of their own.
slopshop-core = { path = "crates/slopshop-core" }
slopshop-render = { path = "crates/slopshop-render" }
slopshop-io = { path = "crates/slopshop-io" }
slopshop-ai = { path = "crates/slopshop-ai" }
# static-dxc: DXC built in (ADR 0019), used by default on Windows x64 instead of FXC.
wgpu = { version = "30.0.1", features = ["static-dxc"] }
pollster = "1.0.1"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tga",
    "ico",
    "pnm",
    "qoi",
    "ff",
    "hdr",
    "exr",
    "dds",
    "rayon",
] }
tiff = "0.11.3"
gif = "0.14.2"
zune-jpeg = "0.5.15"
exr = "1.74.2"

# Optimize dependencies (wgpu, naga, tauri…) even in dev builds: unoptimized GPU/driver-side
# code makes interactive testing misleadingly slow. Our own crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 2

# Pixel loops (tiling, pyramid) over 100+ MP images are unusable unoptimized, even in dev.
[profile.dev.package.slopshop-core]
opt-level = 2

# Same for the file formats' own byte loops (e.g. the `.slop` tile filters).
[profile.dev.package.slopshop-io]
opt-level = 2

# And for the GPU crate's readbacks and conversions (Bake to Pixels, Copy Merged, exports).
[profile.dev.package.slopshop-render]
opt-level = 2

[workspace.lints.rust]
# `unsafe` must be isolated and justified: opt in locally with `#[allow(unsafe_code)]`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
