[workspace]
resolver = "3"
members = [
    "crates/slopshop-core",
    "crates/slopshop-render",
    "crates/slopshop-io",
    "crates/slopshop-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/laBoiteBleue/slopshop"

[workspace.dependencies]
slopshop-core = { path = "crates/slopshop-core", version = "0.1.0" }
slopshop-render = { path = "crates/slopshop-render", version = "0.1.0" }
slopshop-io = { path = "crates/slopshop-io", version = "0.1.0" }
wgpu = "30.0.1"
pollster = "1.0.1"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tga",
    "ico",
    "pnm",
    "qoi",
    "ff",
    "hdr",
    "exr",
    "dds",
    "rayon",
] }
tiff = "0.11.3"
gif = "0.14.2"
zune-jpeg = "0.5.15"

# Optimize dependencies (wgpu, naga, tauri…) even in dev builds: unoptimized GPU/driver-side
# code makes interactive testing misleadingly slow. Our own crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 2

# Pixel loops (tiling, pyramid) over 100+ MP images are unusable unoptimized, even in dev.
[profile.dev.package.slopshop-core]
opt-level = 2

[workspace.lints.rust]
# `unsafe` must be isolated and justified: opt in locally with `#[allow(unsafe_code)]`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
