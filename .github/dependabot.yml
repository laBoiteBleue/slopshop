version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # svelte-check's peer range stops at TypeScript 6: take a new major only once it follows.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
