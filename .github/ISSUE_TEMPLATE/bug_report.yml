name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A file that crashes the app in a way that might be exploitable is a
        security problem: report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. …
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File
      description: >
        If a file triggers the problem, attach it (zip it if GitHub refuses the format) or say
        how to get a similar one. Do not attach private images.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or the commit hash for a source build"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: "`slopshop gpu` (CLI) prints what SlopShop sees."
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
