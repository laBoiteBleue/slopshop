name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts a pull request touches: the Rust jobs (the long ones) are skipped when no Rust,
  # shader, Cargo or CI file changes (e.g. a UI-only change). Pushes to main run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # docs/cli.md is checked against the CLI's help by a test.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD"             | grep -qE '^(crates/|app/src-tauri/|Cargo\.|rust-toolchain|deny\.toml|docs/cli\.md|\.github/)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend (format, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build

  dependencies:
    name: Dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Policy in deny.toml (ADR 0006): permissive licenses only, no GPL/AGPL.
      - uses: EmbarkStudios/cargo-deny-action@v2

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Linux uses Mesa's software Vulkan driver (lavapipe), so GPU tests must really run there.
      # Other runners may lack a usable adapter: GPU tests skip instead of failing.
      SLOPSHOP_REQUIRE_GPU: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies (Tauri, software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev mesa-vulkan-drivers

      # The toolchain (with rustfmt and clippy) comes from rust-toolchain.toml via rustup.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The AI helper's executable is behind a feature (ADR 0025); it builds without ONNX
      # Runtime (loaded at run time), and its end-to-end test skips without the models.
      - name: Clippy (AI helper)
        run: cargo clippy -p slopshop-ai --all-targets --features helper --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Test (AI helper)
        run: cargo test -p slopshop-ai --features helper --locked
