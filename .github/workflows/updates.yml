name: Updates

# Installed copies read the update manifest from the permanent pre-release `updates`
# (ADR 0039). When the maintainer publishes a release, its latest.json (written by release.yml
# while the release was a draft) gets the published release's download addresses and notes
# (app/scripts/update-manifest.mjs), and is copied there: from then on, installed copies are
# offered that version. Drafts and tags reach no one. A manual run offers the release named.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release to offer (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  offer:
    name: Offer the release
    # Not for the `updates` pre-release itself, nor for other tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The script as it is on main: the release's own commit may predate it.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Copy its manifest to the updates pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p manifest/offered
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > manifest/release.json
          # Fails unless every package is one of the release's own.
          node app/scripts/update-manifest.mjs manifest/latest.json manifest/release.json "$TAG" \
            > manifest/offered/latest.json
          if ! gh release view updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updates --repo "$GITHUB_REPOSITORY" --prerelease \
              --target main --title "Update manifest" \
              --notes "Not a release: the manifest installed copies of SlopShop read to learn of a new version (ADR 0039). Download SlopShop from the other releases."
          fi
          gh release upload updates manifest/offered/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "Installed copies are now offered $TAG."
