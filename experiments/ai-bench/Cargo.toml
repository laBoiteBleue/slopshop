[package]
name = "ai-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Experiment: latency and VRAM of segmentation models through ONNX Runtime (not part of SlopShop)"
license = "MIT OR Apache-2.0"

# Outside SlopShop's workspace: built on its own, never by CI, until an ADR decides.
[workspace]

[dependencies]
# ONNX Runtime bindings (MIT OR Apache-2.0); the prebuilt ONNX Runtime 1.28 is downloaded at
# build time, a different build per execution provider feature below.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }

[features]
# One GPU execution provider per build: the prebuilt binaries do not combine them.
# DirectML (Windows; DirectML.dll ships with it).
directml = ["ort/directml"]
# WebGPU (Dawn: D3D12, Vulkan, Metal), experimental in ONNX Runtime.
webgpu = ["ort/webgpu"]

[profile.release]
debug = false
