[package]
name = "ai-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Experiment: latency and VRAM of segmentation models through ONNX Runtime (not part of SlopShop)"
license = "GPL-3.0-only"

# Outside SlopShop's workspace: built on its own, never by CI, until an ADR decides.
[workspace]

[dependencies]
# ONNX Runtime bindings (MIT OR Apache-2.0); the prebuilt ONNX Runtime 1.28 is downloaded at
# build time, a different build per execution provider feature below.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tls-native", "api-27"] }

# The refinement experiment reads the test photo and writes PNG crops.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[features]
# One GPU execution provider per build: the prebuilt binaries do not combine them.
# DirectML (Windows; DirectML.dll ships with it).
directml = ["ort/download-binaries", "ort/copy-dylibs", "ort/directml"]
# WebGPU (Dawn: D3D12, Vulkan, Metal), experimental in ONNX Runtime.
webgpu = ["ort/download-binaries", "ort/copy-dylibs", "ort/webgpu"]
# NVIDIA: CUDA, TensorRT and TensorRT for RTX (with DirectML, the prebuilt binary that has them).
# The NVIDIA libraries are not shipped: see README.md.
nvidia = ["ort/download-binaries", "ort/copy-dylibs", "ort/cuda", "ort/tensorrt", "ort/nvrtx", "ort/directml"]
# Microsoft's official ONNX Runtime GPU build, loaded at run time (ORT_DYLIB_PATH): CUDA and
# TensorRT, with kernels for recent GPUs.
official = ["ort/load-dynamic", "ort/cuda", "ort/tensorrt"]

[profile.release]
debug = false
